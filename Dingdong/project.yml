name: Dingdong
options:
  bundleIdPrefix: com.oneul
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W9W4CM597R
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Dingdong:
    type: application
    platform: iOS
    sources: [Dingdong]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneul.dingdong
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Generated/Dingdong-Info.plist
      properties:
        CFBundleDisplayName: 딩동
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

schemes:
  Dingdong:
    build:
      targets: { Dingdong: all }
    run:
      config: Debug
