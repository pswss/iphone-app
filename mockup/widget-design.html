<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 — 홈 위젯 디자인 목업</title>
<style>
  :root {
    --accent: #383D73;
    --ink: #1c1c2e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; color: var(--ink);
         background: #f2f2f7; display: flex; min-height: 100vh; }

  /* ── 좌측: 홈 화면 미리보기 ── */
  #stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
           background: linear-gradient(135deg, #ffedE6 0%, #edf0ff 50%, #e6faf2 100%); padding: 40px 20px; }
  #stage.dark { background: linear-gradient(135deg, #17151f 0%, #101623 55%, #0e1a17 100%); }
  #variantTitle { font-weight: 800; font-size: 15px; color: var(--ink); opacity: .75; }
  #stage.dark #variantTitle { color: #eee; }

  .widget { position: relative; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.28);
            transition: width .25s, height .25s; }
  .widget .pad { position: absolute; inset: 0; padding: 15px; display: flex; flex-direction: column; }

  /* 무지개 바 */
  .bar { position: relative; display: flex; gap: 2px; width: 100%; }
  .bar .seg { border-radius: 4px; flex-shrink: 0; }
  .bar .track { position: absolute; inset: 0; border-radius: 4px; }
  .needle { position: absolute; top: -3px; bottom: -3px; width: 2.5px; border-radius: 2px; background: #fff;
            box-shadow: 0 0 4px rgba(0,0,0,.45); }

  [contenteditable] { outline: none; border-radius: 3px; }
  [contenteditable]:hover { box-shadow: 0 0 0 1.5px rgba(120,140,255,.55); cursor: text; }

  /* ── 우측: 컨트롤 패널 ── */
  #panel { width: 340px; background: #fff; border-left: 1px solid #e3e3ea; padding: 18px 18px 40px;
           overflow-y: auto; height: 100vh; position: sticky; top: 0; }
  #panel h1 { font-size: 17px; margin: 2px 0 14px; }
  #panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: #8a8a94; margin: 20px 0 8px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tabs button { padding: 9px 6px; border: 1.5px solid #d9d9e3; background: #fafafc; border-radius: 10px;
                 font-size: 12.5px; font-weight: 700; color: #555; cursor: pointer; font-family: inherit; }
  .tabs button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 13px; }
  .row label { flex: 1; }
  .row input[type=range] { flex: 1.2; accent-color: var(--accent); }
  .row input[type=color] { width: 34px; height: 26px; border: none; background: none; padding: 0; cursor: pointer; }
  .row .val { width: 38px; text-align: right; color: #8a8a94; font-variant-numeric: tabular-nums; font-size: 12px; }
  .seg2 { display: flex; border: 1.5px solid #d9d9e3; border-radius: 9px; overflow: hidden; }
  .seg2 button { flex: 1; border: none; background: #fafafc; padding: 6px 10px; font-size: 12px; font-weight: 700;
                 color: #555; cursor: pointer; font-family: inherit; }
  .seg2 button.on { background: var(--accent); color: #fff; }
  .sw { position: relative; width: 40px; height: 24px; }
  .sw input { display: none; }
  .sw i { position: absolute; inset: 0; border-radius: 12px; background: #d9d9e3; transition: .15s; }
  .sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
                 background: #fff; transition: .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .sw input:checked + i { background: var(--accent); }
  .sw input:checked + i::after { left: 18px; }
  .palette { display: flex; gap: 5px; }
  .palette input { width: 30px; height: 26px; border: none; background: none; padding: 0; cursor: pointer; }
  .hint { font-size: 11.5px; color: #9a9aa4; line-height: 1.55; margin-top: 4px; }
</style>
</head>
<body>

<div id="stage">
  <div id="variantTitle"></div>
  <div class="widget" id="w"><div class="pad" id="wp"></div></div>
  <div class="hint" id="stageHint" style="max-width:380px;text-align:center"></div>
</div>

<div id="panel">
  <h1>오늘 — 홈 위젯 목업</h1>

  <h2>디자인 옵션</h2>
  <div class="tabs" id="tabs"></div>

  <h2>기본</h2>
  <div class="row"><label>위젯 크기</label>
    <div class="seg2" id="sizeSeg"><button data-v="small">소형</button><button data-v="medium" class="on">중형</button></div>
  </div>
  <div class="row"><label>모드</label>
    <div class="seg2" id="modeSeg"><button data-v="light" class="on">라이트</button><button data-v="dark">다크</button></div>
  </div>
  <div class="row"><label>코너 반경</label><input type="range" id="radius" min="12" max="42" value="24"><span class="val" id="radiusV"></span></div>
  <div class="row"><label>글자 크기</label><input type="range" id="fscale" min="80" max="130" value="100"><span class="val" id="fscaleV"></span></div>

  <h2>배경</h2>
  <div class="row"><label>스타일</label>
    <div class="seg2" id="bgSeg"><button data-v="dark">딥 블랙</button><button data-v="pastel">파스텔</button><button data-v="custom">커스텀</button></div>
  </div>
  <div class="row"><label>커스텀 색</label><input type="color" id="bgColor" value="#383D73"></div>
  <div class="row"><label>불투명도</label><input type="range" id="bgAlpha" min="40" max="100" value="88"><span class="val" id="bgAlphaV"></span></div>

  <h2>요소 표시</h2>
  <div class="row"><label>날짜 라벨</label><label class="sw"><input type="checkbox" id="showDay" checked><i></i></label></div>
  <div class="row"><label>남은 시간(카운트다운)</label><label class="sw"><input type="checkbox" id="showCount" checked><i></i></label></div>
  <div class="row"><label>무지개 타임라인 바</label><label class="sw"><input type="checkbox" id="showBar" checked><i></i></label></div>
  <div class="row"><label>현재 일정 줄</label><label class="sw"><input type="checkbox" id="showNow" checked><i></i></label></div>
  <div class="row"><label>다음 일정 줄</label><label class="sw"><input type="checkbox" id="showNext" checked><i></i></label></div>
  <div class="row"><label>바 높이</label><input type="range" id="barH" min="8" max="26" value="14"><span class="val" id="barHV"></span></div>

  <h2>무지개 팔레트</h2>
  <div class="palette" id="pal"></div>
  <div class="hint">색을 눌러 바꾸면 바·도트에 바로 반영돼요.</div>

  <h2>메모</h2>
  <div class="hint">· 위젯 안 모든 글자는 <b>클릭해서 직접 수정</b>할 수 있어요.<br>
  · 마음에 드는 조합이 나오면 스크린샷이나 “옵션 B, 코너 28, 바 18” 식으로 알려 주세요 — 그대로 SwiftUI로 옮길게요.</div>
</div>

<script>
// ── 상태 ──
const S = {
  variant: "A", size: "medium", mode: "light",
  bg: "dark", bgColor: "#383D73", bgAlpha: 88,
  radius: 24, fscale: 100, barH: 14,
  showDay: true, showCount: true, showBar: true, showNow: true, showNext: true,
  palette: ["#FF453A", "#FF9F0A", "#FFD60A", "#30D158", "#0A84FF", "#5E5CE6", "#BF5AF2"],
};

// 샘플 하루(07–22시 창): [시작h, 끝h, 제목]
const DAY = [[9,10,"수학"],[10,11,"영어"],[11,12.5,"물리 실험"],[13.5,15,"동아리"],[16,18,"학원"],[19,20,"운동"]];
const NOW_H = 10.5;                      // 현재 시각 10:30 — '영어' 진행 중
const WIN = [7, 22];

const VARIANTS = {
  A: { name: "A · 지금 스타일(타임라인)", hint: "현재 위젯 구조 그대로 — 날짜·카운트다운·무지개 바·현재/다음 줄. 배경과 수치만 조절해 보세요." },
  B: { name: "B · 파스텔 글래스", hint: "앱 배경과 같은 파스텔 그라데이션 + 유리 카드 안에 바를 넣은 밝은 버전." },
  C: { name: "C · 다음 일정 포커스", hint: "다음(또는 현재) 일정 하나를 크게 — 시각이 주인공. 바는 하단에 얇게." },
  D: { name: "D · 아젠다 리스트", hint: "남은 일정을 리스트로 — 진행 중 항목은 좌측 컬러 도트와 강조 표시." },
};

// ── 유틸 ──
const $ = id => document.getElementById(id);
const pct = h => (h - WIN[0]) / (WIN[1] - WIN[0]) * 100;
const hexA = (hex, a) => hex + Math.round(a * 2.55).toString(16).padStart(2, "0");
const t12 = h => { const H = Math.floor(h), m = Math.round((h - H) * 60);
  return `${H < 12 ? "오전" : "오후"} ${((H + 11) % 12) + 1}:${String(m).padStart(2, "0")}`; };
const cur = () => DAY.findIndex(e => e[0] <= NOW_H && NOW_H < e[1]);
const nxt = () => DAY.findIndex(e => e[0] > NOW_H);
const remain = () => { const n = nxt(), c = cur();
  const target = c >= 0 ? DAY[c][1] : (n >= 0 ? DAY[n][0] : null);
  if (target == null) return "끝";
  const mins = Math.round((target - NOW_H) * 60);
  return (c >= 0 ? "남은 " : "다음까지 ") + (mins < 60 ? mins + "분" : Math.floor(mins / 60) + "시간");
};
const ed = (txt, style = "") => `<span contenteditable spellcheck="false" style="${style}">${txt}</span>`;

// ── 무지개 바 ──
function barHTML(h, trackColor) {
  const segs = DAY.map((e, i) =>
    `<div class="seg" style="left:${pct(e[0])}%;width:${pct(e[1]) - pct(e[0])}%;position:absolute;top:0;bottom:0;background:${S.palette[i % 7]}"></div>`).join("");
  return `<div class="bar" style="height:${h}px">
    <div class="track" style="background:${trackColor}"></div>${segs}
    <div class="needle" style="left:${pct(NOW_H)}%"></div></div>`;
}

// ── 변형 렌더 ──
function render() {
  const w = $("w"), wp = $("wp"), stage = $("stage");
  const small = S.size === "small";
  w.style.width = (small ? 170 : 364) + "px";
  w.style.height = "170px";
  w.style.borderRadius = S.radius + "px";
  wp.style.fontSize = (S.fscale / 100) * 13 + "px";
  stage.className = S.mode === "dark" ? "dark" : "";
  $("variantTitle").textContent = VARIANTS[S.variant].name;
  $("stageHint").textContent = VARIANTS[S.variant].hint;

  // 배경
  let bg, inkMain, inkSub, track;
  if (S.bg === "pastel") {
    bg = "linear-gradient(135deg,#FFEDE6,#EDF0FF 52%,#E6FAF2)";
    inkMain = "#383D73"; inkSub = "rgba(56,61,115,.55)"; track = "rgba(56,61,115,.12)";
  } else if (S.bg === "custom") {
    bg = hexA(S.bgColor, S.bgAlpha);
    inkMain = "#fff"; inkSub = "rgba(255,255,255,.62)"; track = "rgba(255,255,255,.18)";
  } else {
    bg = `rgba(10,10,14,${S.bgAlpha / 100})`;
    inkMain = "#fff"; inkSub = "rgba(255,255,255,.62)"; track = "rgba(255,255,255,.18)";
  }
  w.style.background = bg;

  const c = cur(), n = nxt();
  const head = `
    <div style="display:flex;align-items:baseline;gap:8px">
      ${S.showDay ? `<span style="font-weight:800;color:${inkSub};font-size:.85em">${ed("7월 7일 (월)")}</span>` : ""}
      <span style="flex:1"></span>
      ${S.showCount ? `<span style="font-weight:800;color:${inkMain};font-size:.85em">${ed(remain())}</span>` : ""}
    </div>`;

  if (S.variant === "A" || S.variant === "B") {
    const glass = S.variant === "B";
    if (glass && S.bg === "dark") { /* B는 기본 파스텔 느낌 유지 */ }
    const inner = `
      ${head}
      ${S.showBar ? `<div style="margin:7px 0 6px">${barHTML(S.barH, track)}</div>` : ""}
      ${S.showNow ? `<div style="font-weight:800;color:${inkMain};font-size:.95em;white-space:nowrap;overflow:hidden">
          ${ed("현재 · " + (c >= 0 ? DAY[c][2] : "진행 중인 일정 없음"))}</div>` : ""}
      ${S.showNext && !small && n >= 0 ? `<div style="color:${inkSub};font-size:.8em;margin-top:2px;white-space:nowrap">
          ${ed("다음 · " + DAY[n][2] + " " + t12(DAY[n][0]))}</div>` : ""}
      <div style="flex:1"></div>`;
    wp.innerHTML = glass
      ? `<div style="flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,.42);backdrop-filter:blur(6px);
           border:1px solid rgba(255,255,255,.6);border-radius:${Math.max(10, S.radius - 10)}px;padding:11px 13px">${inner}</div>`
      : inner;
    if (glass && S.bg === "custom") w.style.background = hexA(S.bgColor, S.bgAlpha);
    else if (glass) w.style.background = "linear-gradient(135deg,#FFEDE6,#EDF0FF 52%,#E6FAF2)";

  } else if (S.variant === "C") {
    const t = c >= 0 ? DAY[c] : (n >= 0 ? DAY[n] : null);
    const tag = c >= 0 ? "진행 중" : "다음 일정";
    wp.innerHTML = `
      ${head}
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
        <div style="color:${inkSub};font-weight:800;font-size:.78em;letter-spacing:.4px">${ed(tag)}</div>
        <div style="font-size:${small ? 1.9 : 2.3}em;font-weight:300;color:${inkMain};font-variant-numeric:tabular-nums;line-height:1.15">
          ${ed(t ? t12(t[0]) : "—")}</div>
        <div style="font-weight:800;color:${inkMain};font-size:1.05em;white-space:nowrap;overflow:hidden">
          ${ed(t ? t[2] : "오늘 일정 없음")}</div>
      </div>
      ${S.showBar ? barHTML(Math.max(6, S.barH - 6), track) : ""}`;

  } else { // D 아젠다
    const items = DAY.filter(e => e[1] > NOW_H).slice(0, small ? 3 : 4);
    wp.innerHTML = `
      ${head}
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:${small ? 4 : 6}px;margin-top:5px">
        ${items.map(e => { const i = DAY.indexOf(e), on = i === c; return `
          <div style="display:flex;align-items:center;gap:8px;${on ? "" : "opacity:.72"}">
            <span style="width:8px;height:8px;border-radius:50%;background:${S.palette[i % 7]};
                  ${on ? "box-shadow:0 0 0 3px " + hexA(S.palette[i % 7].slice(0, 7), 22) : ""}"></span>
            <span style="color:${inkSub};font-size:.8em;font-variant-numeric:tabular-nums;width:56px">${ed(t12(e[0]))}</span>
            <span style="color:${inkMain};font-weight:${on ? 800 : 600};font-size:.92em;white-space:nowrap;overflow:hidden">
              ${ed(e[2] + (on ? " · 진행 중" : ""))}</span>
          </div>`; }).join("")}
      </div>
      ${S.showBar ? barHTML(Math.max(6, S.barH - 8), track) : ""}`;
  }

  // 컨트롤 표시값
  $("radiusV").textContent = S.radius;
  $("fscaleV").textContent = S.fscale + "%";
  $("bgAlphaV").textContent = S.bgAlpha + "%";
  $("barHV").textContent = S.barH;
}

// ── 컨트롤 배선 ──
const tabs = $("tabs");
Object.entries(VARIANTS).forEach(([k, v]) => {
  const b = document.createElement("button");
  b.textContent = v.name; b.dataset.k = k;
  if (k === S.variant) b.classList.add("on");
  b.onclick = () => { S.variant = k; tabs.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.k === k)); render(); };
  tabs.appendChild(b);
});
function seg(id, key) {
  $(id).querySelectorAll("button").forEach(b => b.onclick = () => {
    S[key] = b.dataset.v;
    $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
}
seg("sizeSeg", "size"); seg("modeSeg", "mode"); seg("bgSeg", "bg");
[["radius","radius"],["fscale","fscale"],["bgAlpha","bgAlpha"],["barH","barH"]].forEach(([id,k]) =>
  $(id).oninput = e => { S[k] = +e.target.value; render(); });
$("bgColor").oninput = e => { S.bgColor = e.target.value; S.bg = "custom";
  document.querySelectorAll("#bgSeg button").forEach(x => x.classList.toggle("on", x.dataset.v === "custom")); render(); };
["showDay","showCount","showBar","showNow","showNext"].forEach(k =>
  $(k).onchange = e => { S[k] = e.target.checked; render(); });
S.palette.forEach((c, i) => {
  const inp = document.createElement("input"); inp.type = "color"; inp.value = c;
  inp.oninput = () => { S.palette[i] = inp.value; render(); };
  $("pal").appendChild(inp);
});
render();
</script>
</body>
</html>
